[build]
  # Build configuration for Netlify with optimization
  publish = "."
  command = "echo 'Static site - no build required'"

[build.environment]
  NODE_VERSION = "18"

# CSP Nonce Plugin for enhanced security
[[plugins]]
  package = "netlify-plugin-csp-nonce"

# Asset optimization
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true

[[headers]]
  # Apply security headers to all routes
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[redirects]]
  # Handle 404 errors by redirecting to home page
  from = "/*"
  to = "/index.html"
  status = 404

[[redirects]]
  # Redirect www to non-www (if using custom domain)
  from = "https://www.americaprotectivesecurity.com/*"
  to = "https://americaprotectivesecurity.com/:splat"
  status = 301
  force = true

# Performance optimization
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true